name: Fetch Grocery Flyers

on:
  schedule:
    - cron: '0 13 * * 4'  # Every Thursday at 13:00 UTC (9 AM ET)
  workflow_dispatch:        # Allow manual runs from the Actions tab
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'logs/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short

  fetch:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch all portfolio flyers
        run: python -m scripts.fetch_flyers

      - name: Create pull request with fetched results
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            data/
            logs/
          commit-message: "chore: weekly flyer fetch (run ${{ github.run_number }})"
          branch: "automation/weekly-flyer-fetch"
          delete-branch: true
          title: "chore: weekly flyer fetch (run ${{ github.run_number }})"
          body: Automated weekly flyer data refresh.

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
