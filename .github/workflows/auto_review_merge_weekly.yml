name: Auto Review and Merge Weekly Data PR

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'data/**'
      - 'logs/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-review-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guardrails:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/weekly-flyer-fetch'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Validate changed files are data/logs only
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = pr.number;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 }
            );

            const changed = files.map(f => f.filename);
            const disallowed = changed.filter(
              f => !(f.startsWith('data/') || f.startsWith('logs/'))
            );

            const risky = changed.filter(
              f =>
                f.startsWith('.github/workflows/') ||
                f.startsWith('scripts/') ||
                f.startsWith('fetchers/') ||
                f.startsWith('pipeline/') ||
                f.startsWith('tests/')
            );

            if (disallowed.length > 0 || risky.length > 0) {
              core.setOutput('eligible', 'false');
              core.setOutput(
                'reason',
                `Blocked. Non data/logs changes: ${disallowed.join(', ') || 'none'}; risky paths: ${risky.join(', ') || 'none'}`
              );
              core.setFailed(
                `Auto-merge blocked. Non data/logs changes: ${disallowed.join(', ') || 'none'}; risky paths: ${risky.join(', ') || 'none'}`
              );
              return;
            }

            if (changed.length === 0) {
              core.setOutput('eligible', 'false');
              core.setOutput('reason', 'Blocked. No changed files found.');
              core.setFailed('Auto-merge blocked because no changed files were detected.');
              return;
            }

            core.setOutput('eligible', 'true');
            core.setOutput('reason', 'Eligible for auto approval and auto-merge.');
            core.info(`Eligible files: ${changed.join(', ')}`);

  approve:
    needs: guardrails
    if: needs.guardrails.outputs.eligible == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Approve automation PR
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.AUTOMATION_BOT_TOKEN }}

  enable-automerge:
    needs: [guardrails, approve]
    if: needs.guardrails.outputs.eligible == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.AUTOMATION_BOT_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
