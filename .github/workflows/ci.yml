name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'logs/**'
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'logs/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: |
          python -m py_compile \
            fetchers/*.py \
            pipeline/*.py \
            parsers/*.py \
            scripts/*.py

      - name: Lint with ruff
        run: ruff check --ignore E501 .

      - name: Type check with mypy (non-blocking baseline)
        continue-on-error: true
        run: mypy --config-file mypy.ini fetchers pipeline parsers scripts

      - name: Run critical tests
        run: python -m pytest tests/ -m critical -v --tb=short --cov=fetchers --cov=pipeline --cov=parsers --cov=scripts --cov-report=term-missing
